name: Ensaio
on:
  push:
    branches: [ensaio-v2]
permissions:
  contents: read
jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python coleta_pools.py /tmp/pools.json
      - uses: actions/upload-artifact@v4
        with:
          name: pools
          path: /tmp/pools.json
          retention-days: 3
