name: Ensaio
on:
  push:
    branches: [ensaio-v2]
permissions:
  contents: read
jobs:
  ensaio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: cp -r . /tmp/copia && python ensaio_conc.py /tmp/copia
