name: "Ideias: conferir teste novo"

# Quando o Claude cria um teste a partir de uma ideia de vídeo (lab/ideias/), este fluxo roda o teste uma vez com os
# dados de verdade. Funcionou: liga o teste (o laboratório de hora em hora passa a rodá-lo). Deu erro: deixa desligado
# e guarda o erro no índice, para o Claude corrigir. Nada aqui compra ou vende: é tudo simulação.
on:
  push:
    branches: [main]
    paths: ["lab/ideias/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ideias-conferir
  cancel-in-progress: false

jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Conferir os testes marcados
        run: python lab/conferir_ideias.py
      - name: Salvar
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add lab/ideias/indice.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Ideias: testes conferidos"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
