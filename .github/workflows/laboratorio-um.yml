# Roda UM laboratório só (o teste novo antes da próxima rodada dos robôs). Mexe só nos arquivos dele, então pode rodar
# junto com o robos.yml sem conflito: na rodada seguinte, o robô vê que esse teste rodou há menos de 50 min e pula.
name: Laboratório (um só)

on:
  workflow_dispatch:
    inputs:
      lab:
        description: "Qual (por exemplo concentradas, memecoins)"
        required: true
        default: "concentradas"

concurrency:
  group: laboratorio-um
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  um:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rodar ${{ inputs.lab }}
        env:
          LAB: ${{ inputs.lab }}
        run: python -c "import importlib, os, sys; sys.path.insert(0, '.'); importlib.import_module('lab.rodar_' + os.environ['LAB']).main()"
      - name: Guardar só os arquivos dele
        env:
          LAB: ${{ inputs.lab }}
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add "saida/$LAB.json" "lab/dados/${LAB}_estado.json"
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -q -m "Laboratório ($LAB): $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do git push -q && exit 0; sleep 5; git pull -q --rebase; done
          exit 1
