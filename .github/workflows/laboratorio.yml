name: Laboratório

on:   # só na mão: quem roda de hora em hora é o robos.yml
  workflow_dispatch: {}

concurrency:
  group: laboratorio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Laboratórios (funding, grade e DCA...)
        run: python lab/rodar.py
      - name: Guardar no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add lab/dados saida
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -q -m "Laboratório: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
