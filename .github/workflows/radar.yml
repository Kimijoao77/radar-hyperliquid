name: Radar

on:
  schedule:
    - cron: "23 * * * *"     # de hora em hora (minuto 23, longe da hora cheia)
  workflow_dispatch: {}

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar (leaderboard, fills e saldo)
        run: python coletar.py 25
      - name: Analisar (sorte x habilidade, estilo, relatório)
        run: python analisar.py
      - name: Guardar os dados no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add dados saida
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -q -m "Radar: coleta $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
