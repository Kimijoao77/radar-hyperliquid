name: Simular a máquina desde o começo

# Refaz o copy trading desde 03/11 como se a máquina 24 h existisse desde o começo (lab/simular_host.py) e guarda o
# resultado em saida/simulacao_host.json. Só roda quando alguém pede.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  simular:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python lab/simular_host.py
      - name: Guardar o resultado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add saida/simulacao_host.json
          git diff --cached --quiet || git commit -q -m "Simulação: a máquina desde o começo ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
